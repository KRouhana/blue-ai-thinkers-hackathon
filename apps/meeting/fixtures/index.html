<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit · prepared Fork fixture</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fbfcfd;color:#263148;font:14px system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #9cb0f9;outline-offset:3px}.topbar{height:72px;border-bottom:1px solid #e7eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:white}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:750;letter-spacing:-.5px}.mark{width:28px;height:28px;background:#5c6ed9;color:white;border-radius:9px;display:grid;place-items:center}.badge{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#687a91;background:#f0f3f8;border:1px solid #e1e7ef;padding:6px 9px;border-radius:6px}.layout{display:grid;grid-template-columns:180px 1fr;min-height:calc(100vh - 72px)}nav{padding:28px 16px;border-right:1px solid #e7eaf0;background:white}nav p{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8791a2;padding:0 12px}nav div{padding:11px 12px;margin-bottom:6px;color:#6d788e;border-radius:7px}.active{background:#eef0fc;color:#5564bf;font-weight:600}.main{padding:38px;min-width:0}.eyebrow{font-size:11px;color:#8b94a5;text-transform:uppercase;letter-spacing:.1em}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:10px 0 32px}h1{font-size:29px;letter-spacing:-1px;margin:0 0 7px}p{color:#7d8797;margin:0;line-height:1.6}.primary{border:0;border-radius:7px;background:#5a6bd7;color:white;padding:10px 16px;font-weight:600;white-space:nowrap;transition:padding .2s,background .2s}.filters{display:flex;gap:8px;margin-bottom:22px;align-items:center}.filter,.invite{border:1px solid #e1e6ee;background:white;border-radius:6px;padding:8px 12px;color:#647087}.filter.selected{background:#eef0fb;color:#5564bf;border-color:#c7cef0}.count{margin-left:auto;font-size:12px;color:#99a2b1}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.column{background:#f1f3f7;padding:12px;border-radius:10px}.column h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7b8699;margin:3px 1px 15px}.task{background:white;border:1px solid #e3e7ef;border-radius:8px;padding:15px;margin-bottom:10px;box-shadow:0 2px 2px #28324803}.task h3{font-size:13px;line-height:1.5;margin:10px 0 16px;font-weight:600}.tag{font-size:10px;background:#f0edff;color:#8c76bf;border-radius:4px;padding:4px 6px}.tag.green{background:#e7f3ef;color:#57987e}.tag.blue{background:#eaf0fd;color:#6681bb}.meta{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#9aa3b2}.avatar{width:23px;height:23px;border-radius:50%;background:#f0e6d9;display:grid;place-items:center;color:#a58c6e}.overdue{color:#c57b75}.foot{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:30px}.notice{padding:12px 0;font-size:12px;color:#8490a3;max-width:480px}.empty{font-size:12px;padding:15px 4px;color:#96a0b0}@media(max-width:760px){.layout{grid-template-columns:1fr}nav{display:none}.main{padding:22px}.heading{align-items:flex-start;flex-wrap:wrap}.board{gap:8px}.column{padding:8px}.topbar{padding:0 22px}.task{padding:10px}}@media(max-width:470px){.board{grid-template-columns:1fr}.foot{flex-wrap:wrap}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="mark">o</span> orbit</div><span class="badge">Prepared fixture · mock data</span></header>
  <div class="layout">
    <nav aria-label="Mock workspace navigation"><p>Workspace</p><div>Overview</div><div class="active">▦ &nbsp; Team board</div><div>Documents</div><div>Settings</div></nav>
    <main class="main">
      <span class="eyebrow">Workspace / Product team</span>
      <div class="heading"><div><h1>Good ideas, in motion.</h1><p>A little space to keep your team moving forward.</p></div><button id="trial" class="primary" data-preview-id="start-trial">Start trial</button></div>
      <div class="filters"><button id="all" class="filter selected">All tasks</button><button id="overdue" class="filter" hidden data-preview-id="overdue-filter">Overdue</button><span class="count" id="count"></span></div>
      <div id="board" class="board"></div>
      <div class="foot"><p class="notice" id="notice" role="status">This is a prepared UI fixture. Tasks stay in this browser; no database is connected.</p><button class="invite" id="invite" data-preview-id="invite-teammate">Invite teammate</button></div>
    </main>
  </div>
  <script type="module" src="/preview.js"></script>
</body>
</html>

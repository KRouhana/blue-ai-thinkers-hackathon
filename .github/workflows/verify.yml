# Track B CI. Runs the same `npm run verify` a developer runs locally: lint, typecheck,
# unit tests, and the deterministic scenario replay. No credentials, so no live model or
# engine path is exercised here — by design, those fail loudly rather than falling back.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # node:sqlite needs >= 22.13; .nvmrc pins the major the starter kit uses.
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Scenario replay (fixture planner, fixture engine)
        run: npm run replay -- --planner=fixture
